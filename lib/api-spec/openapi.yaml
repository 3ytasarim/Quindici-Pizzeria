openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: info
    description: Restaurant info operations
  - name: menu
    description: Menu operations
  - name: reservations
    description: Reservation operations
paths:
  /info:
    get:
      operationId: getRestaurantInfo
      tags: [info]
      summary: Get restaurant contact info and location
      responses:
        "200":
          description: Restaurant info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantInfo"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /pizza:
    get:
      operationId: listPizza
      tags: [menu]
      summary: List all pizza items
      responses:
        "200":
          description: Pizza list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PizzaItem"
  /dishes:
    get:
      operationId: listDishes
      tags: [menu]
      summary: List all dishes
      responses:
        "200":
          description: Dishes list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dish"
  /reservations/availability:
    get:
      operationId: getReservationAvailability
      tags: [reservations]
      summary: Get time-slot availability for a given date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
          description: Date in DD.MM.YYYY format
      responses:
        "200":
          description: Availability for each time slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "400":
          description: Missing or invalid date parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations:
    post:
      operationId: createReservation
      tags: [reservations]
      summary: Create a table reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationInput"
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResult"
        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations/lookup:
    get:
      operationId: lookupReservations
      tags: [reservations]
      summary: Look up upcoming reservations by guest email
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
          description: Guest email address
      responses:
        "200":
          description: List of upcoming reservations for this email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestReservationList"
        "400":
          description: Missing email parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations/{id}/cancel:
    delete:
      operationId: cancelReservation
      tags: [reservations]
      summary: Cancel a reservation (guest self-service, verified by email)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Reservation ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelReservationInput"
      responses:
        "200":
          description: Reservation cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelReservationResult"
        "400":
          description: Missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Email does not match reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    RestaurantInfo:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        lat:
          type: number
        lng:
          type: number
      required:
        - name
        - address
        - phone
        - email
        - lat
        - lng
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PizzaItem:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        imageUrl:
          type: string
        isDefault:
          type: boolean
      required:
        - id
        - label
        - imageUrl
    Dish:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        desc:
          type: string
        imageUrl:
          type: string
      required:
        - id
        - name
    CreateReservationInput:
      type: object
      properties:
        date:
          type: string
        time:
          type: string
        guests:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
        notes:
          type: string
      required:
        - date
        - time
        - guests
        - firstName
        - lastName
        - phone
        - email
    ReservationResult:
      type: object
      properties:
        success:
          type: boolean
        id:
          type: string
      required:
        - success
        - id
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    TimeSlotAvailability:
      type: object
      properties:
        time:
          type: string
          description: Time slot in HH:MM format
        available:
          type: boolean
          description: Whether this slot still has capacity
        count:
          type: integer
          description: Number of existing reservations for this slot
      required:
        - time
        - available
        - count
    AvailabilityResponse:
      type: object
      properties:
        date:
          type: string
          description: The queried date (DD.MM.YYYY)
        slots:
          type: array
          items:
            $ref: "#/components/schemas/TimeSlotAvailability"
      required:
        - date
        - slots
    GuestReservation:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        time:
          type: string
        guests:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
        notes:
          type: string
      required:
        - id
        - date
        - time
        - guests
        - firstName
        - lastName
        - status
    GuestReservationList:
      type: object
      properties:
        reservations:
          type: array
          items:
            $ref: "#/components/schemas/GuestReservation"
      required:
        - reservations
    CancelReservationInput:
      type: object
      properties:
        email:
          type: string
      required:
        - email
    CancelReservationResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
